[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abci-job"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11",
]

[tool.setuptools]
packages = ["abci_job"]

[tool.pytest.ini_options]
pythonpath = ["."]
